apiVersion: v1
kind: Pod
metadata:
  name: pingone-promote
  labels:
    app: pingone-promote
spec:
  automountServiceAccountToken: false
  restartPolicy: Always
  volumes:
    - name: config
      configMap:
        name: pingone-promote-config
    - name: secret-source
      secret:
        secretName: pingone-promote-secrets
        defaultMode: 0400
    - name: service-secrets
      emptyDir:
        medium: Memory
        sizeLimit: 1Mi
    - name: tools
      persistentVolumeClaim:
        claimName: pingone-promote-tools
    - name: tmp
      emptyDir:
        sizeLimit: 256Mi
  initContainers:
    - name: stage-secret
      image: busybox:1.37.0
      command: ["sh", "-ec", "umask 077; cp /secret-source/secrets.env /service-secrets/secrets.env; chown 10001:10001 /service-secrets/secrets.env; chmod 0600 /service-secrets/secrets.env"]
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
          add: ["CHOWN"]
      volumeMounts:
        - name: secret-source
          mountPath: /secret-source
          readOnly: true
        - name: service-secrets
          mountPath: /service-secrets
  containers:
    - name: server
      image: pingone-promote:release
      args: ["serve", "--config", "/etc/pingone-promote/config.json"]
      ports:
        - name: http
          containerPort: 8080
          protocol: TCP
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: "2"
          memory: 1Gi
      volumeMounts:
        - name: config
          mountPath: /etc/pingone-promote
          readOnly: true
        - name: service-secrets
          mountPath: /run/pingone-promote
          readOnly: true
        - name: tools
          mountPath: /opt/pingone-promote
          readOnly: true
        - name: tmp
          mountPath: /tmp
      env:
        - name: TMPDIR
          value: /tmp
