name: Homebrew lifecycle

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to exercise in the installer lifecycle"
        type: string
        default: v0.2.0-rc.2
  workflow_call:
    inputs:
      version:
        type: string
        default: v0.2.0-rc.2

permissions:
  contents: read

jobs:
  install-matrix:
    name: Install and lifecycle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15
          - macos-15-intel
          - ubuntu-24.04
    env:
      RELEASE_VERSION: ${{ inputs.version || 'v0.2.0-rc.2' }}
      RELEASE_REF: ${{ github.sha }}
      HOMEBREW_NO_ANALYTICS: "1"
    steps:
      - name: Check out the exact tested revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install Homebrew on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if ! command -v brew >/dev/null 2>&1; then
            /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          fi
          echo /home/linuxbrew/.linuxbrew/bin >> "$GITHUB_PATH"
          echo /home/linuxbrew/.linuxbrew/sbin >> "$GITHUB_PATH"

      - name: Refresh Homebrew formula metadata
        shell: bash
        run: brew update

      - name: Run real Homebrew install, upgrade, CLI probes, and uninstall
        shell: bash
        run: python3 scripts/test_homebrew.py --version "$RELEASE_VERSION" --ref "$RELEASE_REF"

  assets:
    name: Verify source and build release assets
    needs: install-matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Fetch the pinned tools (checksums verified)
        run: |
          bash scripts/fetch-tools.sh --dest "$RUNNER_TEMP/tools" --with-go
          echo "$RUNNER_TEMP/tools/go/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/tools" >> "$GITHUB_PATH"
      - name: Fetch hosted importer artifacts (checksums verified)
        run: |
          python3 scripts/install-tools.py --bin-dir "$RUNNER_TEMP/hosted-tools" --cache-dir "$RUNNER_TEMP/hosted-cache" --output "$RUNNER_TEMP/hosted-tools.json"
          provider_zip="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["tools"]["providerZip"])' "$RUNNER_TEMP/hosted-tools.json")"
          echo "PINGONE_PROMOTE_PROVIDER_ZIP=$provider_zip" >> "$GITHUB_ENV"
      - name: Test source and build versioned release assets
        env:
          RELEASE_VERSION: ${{ inputs.version || 'v0.2.0-rc.2' }}
          RELEASE_REF: ${{ github.sha }}
          GOFLAGS: -mod=readonly
          GOTOOLCHAIN: local
        run: |
          export PINGONE_PROMOTE_TERRAFORM="$RUNNER_TEMP/tools/terraform"
          export PINGONE_PROMOTE_REAL_TERRAFORMER="$RUNNER_TEMP/tools/pingcli-terraformer"
          go test ./...
          go test -race ./...
          go vet ./...
          python3 -m unittest discover -s scripts -p test_release.py -v
          python3 -m unittest discover -s scripts -p test_check_test_skips.py -v
          python3 scripts/release.py release --version "$RELEASE_VERSION" --ref "$RELEASE_REF" --output dist/release
          python3 scripts/release.py verify --directory dist/release
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: installation-preview
          path: dist/release/
          if-no-files-found: error
          retention-days: 7
