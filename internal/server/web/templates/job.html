{{define "content"}}{{$d := .Data.D}}
{{if .Data.Running}}
<p class="notice">{{.Data.Stage}}&hellip;</p>
<p>This page refreshes by itself. You can leave it and come back; the work continues on the server.</p>
<form method="post" action="/drafts/{{$d.ID}}/cancel">
  <input type="hidden" name="csrf" value="{{.CSRF}}">
  <button type="submit">Cancel</button>
</form>
{{else}}
<p class="problem">{{.Data.Err}}</p>
<p><a href="{{.Data.Back}}">Back</a></p>
{{end}}
{{end}}
