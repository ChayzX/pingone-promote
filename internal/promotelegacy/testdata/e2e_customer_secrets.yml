# Sanitized copy of the enterprise pipeline's secret declarations.
.customer-secrets:
  secrets:
    TF_VAR_client_secret:
      vault: apps/pingone-davinci/${VAULT_PATH_ENV}/pingone/client_secret@secret
      file: false

    TF_VAR_davinci_variable_ExampleAuthNCreds_value:
      vault: apps/pingone-davinci/${VAULT_PATH_ENV}/pingone/davinci_variable_ExampleAuthNCreds_value@secret
      file: false

    TF_VAR_PingOne_DaVinci_connection_client:
      vault: apps/pingone-davinci/${VAULT_PATH_ENV}/pingone/PingOne_DaVinci_connection_client_secret@secret
      file: false

    TF_VAR_PingOne_DaVinci_flow_Login_n3sso_hmacKey:
      vault: apps/pingone-davinci/${VAULT_PATH_ENV}/pingone/PingOne_DaVinci_flow_Login_n3sso_hmacKey@secret
      file: false

    # TF_VAR_basicAuthCredDV:
    #   vault: apps/pingone-davinci/${VAULT_PATH_ENV}/pingone/basicAuthCredDV@secret

terraform-plan:
  extends: .customer-secrets
  script:
    - terraform plan -var-file=environments/${ENVIRONMENT}.tfvars
