apply_promotion_dev:
  stage: deploy
  extends: .runner_job
  image: $PROMOTION_GO_IMAGE
  needs:
  - job: plan_promotion_dev
    artifacts: true
  environment:
    name: dev
    action: start
    deployment_tier: development
  rules:
  - if: $PROMOTION_MODE == "deploy" && ($CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web") && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    when: manual
    allow_failure: false
  script:
  - export PROMOTION_ENVIRONMENT="${PROMOTION_ENVIRONMENT:-$CI_ENVIRONMENT_NAME}"
  - test "$PROMOTION_ENVIRONMENT" = "$CI_ENVIRONMENT_NAME" || { echo "Scope PROMOTION_ENVIRONMENT to $CI_ENVIRONMENT_NAME" >&2; exit 1; }
  - 'test -f plan.json || { echo "No plan in dev: the merged request targets another environment. Run the deploy job of the environment named in the merge request." >&2; exit 1; }'
  - test "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH"
  - test -n "${PROMOTION_GITLAB_URL:-}" && test "$PROMOTION_GITLAB_URL" = "$CI_SERVER_URL" || { echo "PROMOTION_GITLAB_URL must match CI_SERVER_URL" >&2; exit 1; }
  - test -n "${PROMOTION_GITLAB_PROJECT_ID:-}" && test "$PROMOTION_GITLAB_PROJECT_ID" = "$CI_PROJECT_ID" || { echo "PROMOTION_GITLAB_PROJECT_ID must match CI_PROJECT_ID" >&2; exit 1; }
  - ./pingone-runner apply --artifact plan.json --approved-digest-file plan.sha256 --out result.json
  artifacts:
    access: developer
    expire_in: 90 days
    when: always
    paths:
    - plan.json
    - plan.sha256
    - result.json
    - plan.json.execute-intent
  resource_group: pingone-dev
