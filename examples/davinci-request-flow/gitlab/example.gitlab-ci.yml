# Generated by examples/davinci-request-flow/gitlab/make_pipeline.py from
# examples/gitlab/.gitlab-ci.yml for GitLab environments: dev, test, production.
# One promotion project for every target; see the DaVinci kit RUNBOOK.
# PROMOTION_TOOL_REF must be set to a reviewed full commit SHA.
workflow:
  rules:
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    when: always
  - if: $CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web"
    when: always
  - when: never
stages:
- validate
- plan
- deploy
- rollback_plan
- rollback_apply
variables:
  PROMOTION_MODE: deploy
  PROMOTION_RUNNER_TAG: blue
  PROMOTION_GO_IMAGE: golang:1.27
  PROMOTION_VALIDATION_TOOL_REF: REPLACE_WITH_REVIEWED_FULL_COMMIT_SHA
  PROMOTION_VALIDATION_RUNNER_TAG: untrusted-validation
  GIT_DEPTH: '0'
  GIT_STRATEGY: fetch
.runner_job:
  tags:
  - $PROMOTION_RUNNER_TAG
  retry: 0
  resource_group: pingone-validate
  interruptible: false
  before_script:
  - '[[ "${PROMOTION_TOOL_REF:-}" =~ ^[0-9a-f]{40}$ ]] || { echo "Set PROMOTION_TOOL_REF to a reviewed lowercase 40-character commit SHA" >&2; exit 1; }

    '
  - git clone --no-checkout https://github.com/ChayzX/pingone-promote.git .promotion-tool
  - git -C .promotion-tool checkout --detach "$PROMOTION_TOOL_REF"
  - test "$(git -C .promotion-tool rev-parse HEAD)" = "$PROMOTION_TOOL_REF"
  - cd .promotion-tool
  - go build -o ../pingone-runner ./cmd/pingone-runner
  - cd ..
.validation_job:
  tags:
  - $PROMOTION_VALIDATION_RUNNER_TAG
  retry: 0
  interruptible: false
  before_script:
  - '[[ "${PROMOTION_VALIDATION_TOOL_REF:-}" =~ ^[0-9a-f]{40}$ ]] || { echo "Set PROMOTION_VALIDATION_TOOL_REF to a reviewed lowercase 40-character commit SHA" >&2; exit 1; }

    '
  - git clone --no-checkout https://github.com/ChayzX/pingone-promote.git .promotion-tool
  - git -C .promotion-tool checkout --detach "$PROMOTION_VALIDATION_TOOL_REF"
  - test "$(git -C .promotion-tool rev-parse HEAD)" = "$PROMOTION_VALIDATION_TOOL_REF"
  - cd .promotion-tool
  - go build -o ../pingone-runner ./cmd/pingone-runner
  - cd ..
validate_request:
  stage: validate
  extends: .validation_job
  image: $PROMOTION_GO_IMAGE
  rules:
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  - if: $PROMOTION_MODE == "deploy" && ($CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web")
  script:
  - source ./examples/gitlab/select-request.sh
  - "if [[ -n \"${PROMOTION_INTENT_FILE:-}\" ]]; then\n  ./pingone-runner validate --intent \"$PROMOTION_INTENT_FILE\"\nelse\n  ./pingone-runner validate --request \"$PROMOTION_REQUEST_FILE\"\nfi\n"
  artifacts:
    access: developer
    expire_in: 1 day
    when: always
    paths:
    - selected-request.txt
plan_promotion_dev:
  stage: plan
  extends: .runner_job
  image: $PROMOTION_GO_IMAGE
  environment:
    name: dev
    action: prepare
  rules:
  - if: $PROMOTION_MODE == "deploy" && ($CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web") && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
  - export PROMOTION_ENVIRONMENT="${PROMOTION_ENVIRONMENT:-$CI_ENVIRONMENT_NAME}"
  - test "$PROMOTION_ENVIRONMENT" = "$CI_ENVIRONMENT_NAME" || { echo "Scope PROMOTION_ENVIRONMENT to $CI_ENVIRONMENT_NAME" >&2; exit 1; }
  - source ./examples/gitlab/select-request.sh
  - source ./examples/davinci-request-flow/gitlab/for-this-environment.sh
  - if [[ "$PP_FOR_THIS_ENVIRONMENT" != true ]]; then exit 0; fi
  - "if [[ -n \"${PROMOTION_INTENT_FILE:-}\" ]]; then\n  ./pingone-runner build-request --intent \"$PROMOTION_INTENT_FILE\" --out \"$PROMOTION_REQUEST_FILE\"\nfi\n"
  - ./pingone-runner plan --request "$PROMOTION_REQUEST_FILE" --out plan.json --digest-out plan.sha256 --summary-out plan-summary.md
  artifacts:
    access: developer
    expire_in: 2 days
    when: always
    paths:
    - plan.json
    - plan.sha256
    - plan-summary.md
    - selected-request.txt
  resource_group: pingone-dev
plan_promotion_test:
  stage: plan
  extends: .runner_job
  image: $PROMOTION_GO_IMAGE
  environment:
    name: test
    action: prepare
  rules:
